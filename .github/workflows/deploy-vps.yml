name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "📦 Syncing repository..."
            cd /var/www/zhar-ptica

            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing dependencies..."
            npm ci --prefer-offline --no-audit

            echo "🧹 Cleaning old build..."
            rm -rf dist

            echo "🏗 Building project..."
            npm run build

            echo "🔎 Checking IndexNow key file..."
            test -f dist/35b9ec9bd4634f92814ac23f3b6531fc.txt

            echo "📡 Sending URLs to IndexNow..."

            cat > /tmp/indexnow.json <<EOF
            {
              "host": "xn--80aaasagpu3bjqh7c5d.xn--p1ai",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://xn--80aaasagpu3bjqh7c5d.xn--p1ai/35b9ec9bd4634f92814ac23f3b6531fc.txt",
              "urlList": [
                "https://xn--80aaasagpu3bjqh7c5d.xn--p1ai/",
                "https://xn--80aaasagpu3bjqh7c5d.xn--p1ai/price",
                "https://xn--80aaasagpu3bjqh7c5d.xn--p1ai/politics"
              ]
            }
            EOF

            curl -sS \
              -X POST \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @/tmp/indexnow.json \
              "https://api.indexnow.org/indexnow"

            rm -f /tmp/indexnow.json

            echo ""
            echo "🚀 Deployment finished successfully"


